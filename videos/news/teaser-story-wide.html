<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Heebo'; src: url('../robots/assets/Heebo.ttf') format('truetype'); font-weight: 100 900; }
:root { --navy: #07162a; --blue: #2f8cff; --orange: #ff7a1a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: 'Heebo', sans-serif; color: #fff; }
#stage { position: absolute; inset: 0; overflow: hidden; }
#v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* מכסה את לוגו הערוץ בפינה העליונה */
#bug { position: absolute; top: 52px; right: 26px; width: 300px; height: 170px; border-radius: 18px; background: rgba(7, 22, 42, .92); border: 2px solid rgba(90, 200, 255, .45); display: flex; align-items: center; justify-content: center; }
.wordmark { direction: ltr; display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 52px; letter-spacing: -1px; }
.wordmark .t { color: var(--blue); }
/* פס תחתון שמכסה את פס החדשות */
#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 206px; background: linear-gradient(180deg, rgba(7, 22, 42, .96), #07162a); border-top: 6px solid; border-image: linear-gradient(90deg, var(--blue), var(--orange)) 1; display: flex; align-items: center; justify-content: space-between; padding: 0 70px; }
#headt { font-size: 74px; font-weight: 900; }
#url { direction: ltr; font-size: 40px; font-weight: 800; border: 3px solid var(--orange); border-radius: 999px; padding: 10px 34px; }
.card { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 50% 30%, rgba(47, 140, 255, .30), transparent 60%),
  linear-gradient(rgba(90, 200, 255, .07) 1px, transparent 1px),
  linear-gradient(90deg, rgba(90, 200, 255, .07) 1px, transparent 1px), #07162a;
  background-size: auto, 54px 54px, 54px 54px, auto; background-color: #07162a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; opacity: 0; }
.big { font-size: 140px; font-weight: 900; line-height: 1; }
.mid { font-size: 96px; font-weight: 900; line-height: 1.1; }
.o { color: var(--orange); }
#endcard .wordmark { font-size: 150px; gap: 26px; letter-spacing: -3px; }
#endcard .wordmark svg { width: 150px; height: 114px; }
.urlbig { direction: ltr; border: 3px solid var(--orange); border-radius: 999px; padding: 16px 48px; font-size: 52px; font-weight: 800; }
.plate { background: #fff; border-radius: 22px; padding: 22px 40px; }
.plate img { height: 78px; display: block; }
</style>
</head>
<body>
<div id="stage">
  <img id="v">
  <div id="bug"><div class="wordmark"><svg width="70" height="53" viewBox="0 0 120 90"><g stroke="#2f8cff" stroke-width="7" fill="none"><path d="M14 22 40 40 66 22 92 50M40 40 52 70"/></g><g fill="#2f8cff"><circle cx="14" cy="22" r="10"/><circle cx="40" cy="40" r="11"/><circle cx="66" cy="22" r="10"/><circle cx="52" cy="70" r="8"/></g><circle cx="96" cy="58" r="13" fill="#ff7a1a"/></svg><span>HUB<span class="t">TECH</span></span></div></div>
  <div id="bar"><div id="headt"></div><div id="url">hubtech.co.il</div></div>
  <div class="card" id="titlecard"></div>
  <div class="card" id="endcard">
    <div id="endtop"></div>
    <div class="wordmark" id="ewm"><svg viewBox="0 0 120 90"><g stroke="#2f8cff" stroke-width="6" fill="none"><path d="M14 22 40 40 66 22 92 50M40 40 52 70"/></g><g fill="#2f8cff"><circle cx="14" cy="22" r="10"/><circle cx="40" cy="40" r="11"/><circle cx="66" cy="22" r="10"/><circle cx="52" cy="70" r="8"/></g><circle cx="96" cy="58" r="13" fill="#ff7a1a"/></svg><span>HUB<span class="t">TECH</span></span></div>
    <div id="eurl"><span class="urlbig">hubtech.co.il</span></div>
    <div id="elogo" class="plate"><img src="../robots/assets/logos.png"></div>
  </div>
</div>
<script src="teaser-story-wide-data.js"></script>
<script>
const FPS = 30;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
async function setImg(el, src) { if (el.getAttribute('src') !== src) { el.src = src; await el.decode().catch(() => {}); } }
const SEG = EDIT.segments;
// כניסה רכה: הופעה והחלקה קטנה, בלי זום וקפיצות
const soft = (el, k) => { const e = ease(k / 0.5); el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 24}px)`; };

window.render = async (t) => {
  const s = SEG.find((x) => t >= x.t && t < x.t + x.out) || SEG[SEG.length - 1];
  const k = t - s.t;
  if (s.dir) await setImg($('v'), `${s.dir}/${String(s.freeze ? s.frames : clamp(Math.floor(k * FPS) + 1, 1, s.frames)).padStart(4, '0')}.jpg`);
  $('v').style.filter = s.type === 'title' ? 'brightness(.6)' : 'none';

  // כרטיס פתיחה
  if (s.type === 'title') {
    const lines = s.top.filter((x) => k >= x[0]);
    $('titlecard').innerHTML = lines.map((x, i) => `<div class="${i ? 'mid o' : 'big'}">${x[1]}</div>`).join('');
    [...$('titlecard').children].forEach((c, i) => soft(c, k - lines[i][0]));
    $('titlecard').style.opacity = 1;
  } else $('titlecard').style.opacity = 0;

  // כותרת בפס התחתון
  const showHead = s.type === 'clip' && s.head && k >= (s.headAt || 0);
  $('headt').textContent = showHead ? s.head : '';
  if (showHead) soft($('headt'), k - (s.headAt || 0));
  $('bar').style.opacity = $('bug').style.opacity = s.type === 'clip' ? 1 : 0;

  // כרטיס סיום
  if (s.type === 'end') {
    $('endcard').style.opacity = 1;
    $('v').style.filter = 'brightness(.35) blur(6px)';
    const e = s.top[0];
    $('endtop').innerHTML = `<div class="mid o">${e[1]}</div>`;
    soft($('endtop').firstElementChild, k - e[0]);
    for (const [id, at] of [['ewm', 0.5], ['eurl', 0.9], ['elogo', 1.3]]) soft($(id), k - at);
    $('stage').style.opacity = clamp((EDIT.total - t) / 0.6);
  } else { $('endcard').style.opacity = 0; $('stage').style.opacity = 1; }
};
window.DURATION = EDIT.total;
window.SIZE = [1920, 1080];
</script>
</body>
</html>
